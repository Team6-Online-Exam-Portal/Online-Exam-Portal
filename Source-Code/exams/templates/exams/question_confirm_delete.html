{% extends "base.html" %}

{% block title %}Delete MCQ Question | Online Exam Portal{% endblock %}

{% block content %}
<h1>Delete MCQ Question</h1>

<p>Are you sure you want to delete this question?</p>

<blockquote class="card">{{ question.question_text }}</blockquote>

<p>This action cannot be undone.</p>

<form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete Question</button>
    <a class="btn btn-secondary" href="{% url 'question_list' %}">Cancel</a>
</form>
{% endblock %}
