
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Exam</title>
</head>
<body>
    <h1>Delete Exam</h1>

    <p>Are you sure you want to delete the exam "{{ exam.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete Exam</button>
    </form>

    <p><a href="{% url 'exam_list' %}">Cancel</a></p>
</body>
</html>
