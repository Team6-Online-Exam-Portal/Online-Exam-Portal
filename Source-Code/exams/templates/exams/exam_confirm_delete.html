{% extends "base.html" %}

{% block title %}Delete Exam | Online Exam Portal{% endblock %}

{% block content %}
<h1>Delete Exam</h1>

<p>Are you sure you want to delete the exam "{{ exam.title }}"?</p>

<form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Yes, Delete Exam</button>
    <a class="btn btn-secondary" href="{% url 'exam_list' %}">Cancel</a>
</form>
{% endblock %}
