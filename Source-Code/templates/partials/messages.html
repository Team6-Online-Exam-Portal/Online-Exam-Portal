{# One look for every confirmation and error message (NFR-4). #}
{% if messages %}
<div class="messages">
    {% for message in messages %}
    <div class="message message-{{ message.level_tag }}" role="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}status{% endif %}">
        <span class="visually-hidden">{{ message.level_tag|capfirst }}: </span>{{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
